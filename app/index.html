<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<script src="$WEBAPIS/webapis/webapis.js"></script>
<title>Mi Inicio</title>
<style>
  /* Chromium 85 (Tizen 6.5): nada de inset, :is, aspect-ratio ni otras novedades de CSS */
  :root { --dim:rgba(255,255,255,.66); --faint:rgba(255,255,255,.42); --ease:cubic-bezier(.2,.8,.2,1);
    --glass:rgba(255,255,255,.14); --glassBorder:rgba(255,255,255,.26); --panel:rgba(30,30,36,.95); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#000; color:#fff;
    font-family:"SamsungOne","Samsung One","SF Pro Display","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  /* Todo vive dentro de #root (1920x1080, recortado): si algo asoma fuera, la tele agranda el viewport y encoge la interfaz */
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; }
  .fill { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .gl { background:var(--glass); border:1.5px solid var(--glassBorder);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28), 0 20px 50px rgba(0,0,0,.25); }

  /* ---------- Fondo: dos capas de foto que se funden + capa difuminada ---------- */
  .ph { background-size:cover; background-position:center; opacity:0; transition:opacity 1.2s ease; will-change:opacity; }
  .ph.on { opacity:1; }
  #blur { background-size:cover; background-position:center; opacity:0; transition:opacity .5s ease; will-change:opacity; }
  body.deep #blur, body.over #blur { opacity:1; }
  #scrim { background:
      radial-gradient(1200px 600px at 0% 0%, rgba(0,0,0,.45), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
 }
  /* Oscurecido aparte y animado solo con opacity (la GPU lo compone sin repintar) */
  #dim { background:rgba(0,0,0,.42); opacity:0; transition:opacity .5s ease; will-change:opacity; }
  body.deep #dim, body.over #dim { opacity:1; }

  /* ---------- Top Shelf ---------- */
  #shelf { position:absolute; left:100px; top:96px; width:1100px; transition:opacity .35s ease, transform .45s var(--ease); will-change:opacity, transform; }
  #shelfTitle { font-size:92px; font-weight:800; letter-spacing:-2px; line-height:1; text-shadow:0 4px 30px rgba(0,0,0,.35); }
  #shelfSub { margin-top:18px; font-size:30px; color:rgba(255,255,255,.85); text-shadow:0 2px 12px rgba(0,0,0,.5); display:flex; align-items:center; }
  body.deep #shelf { opacity:0; transform:translateY(-40px); }
  body.inset #shelf { transform:none; }

  /* ---------- Píldora superior derecha (tiempo · hora · perfil) ---------- */
  #pill { position:absolute; right:70px; top:50px; height:64px; border-radius:32px; padding:0 8px 0 24px; display:flex; align-items:center;
    font-size:27px; font-weight:600; transition:transform .2s var(--ease), background .2s, opacity .35s; z-index:4; }
  #pill .w { display:flex; align-items:center; margin-right:20px; }
  #pill .w svg { margin-right:8px; }
  #pill .av { width:48px; height:48px; border-radius:50%; margin-left:18px; background:linear-gradient(135deg,#5e5ce6,#bf5af2);
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#fff; }
  #pill.focus { background:rgba(255,255,255,.96); color:#000; transform:scale(1.08); }
  body.over #pill { opacity:0; }

  /* ---------- Rejilla de apps ---------- */
  #page { position:absolute; left:0; top:0; width:1920px; height:1080px; transition:transform .5s var(--ease), opacity .3s; will-change:transform; }
  /* Con Ajustes abierto la pantalla de inicio desaparece; con el Centro de control queda atenuada */
  body.inset #page, body.inset #shelf { opacity:0; }
  body.incc #page, body.incc #shelf { opacity:.25; }
  body.deep #pill { opacity:0; }
  #dock { position:absolute; border-radius:46px; transition:opacity .4s; }
  .tile { position:absolute; left:0; top:0; width:260px; height:156px; transition:transform .38s var(--ease); }
  /* La tarjeta se dibuja a tamaño enfocado (116%) y se reduce cuando no tiene foco: así nunca se
     pixela ni "salta" al ampliarse (el motor rasteriza a tamaño grande y solo escala hacia abajo). */
  .tile .card { position:absolute; left:-8%; top:-8%; width:116%; height:116%; border-radius:30px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; transform:scale(.862); transition:transform .2s var(--ease), opacity .2s;
    will-change:transform; backface-visibility:hidden; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 2px 0 rgba(255,255,255,.22); }
  .tile .card img { max-width:60%; max-height:62%; }
  .tile .card img.full { max-width:none; max-height:none; height:108%; }  /* recorta los marcos finos que traen algunos iconos */
  .tile .spec { position:absolute; left:0; top:0; width:100%; height:100%; border-radius:30px;
    background:linear-gradient(160deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,0) 42%); opacity:0; transition:opacity .2s; }
  .tile .sh { position:absolute; left:2%; top:14%; width:96%; height:96%; border-radius:30px; box-shadow:0 34px 60px rgba(0,0,0,.6);
    opacity:0; transition:opacity .2s; }
  .tile .lbl { position:absolute; left:-40px; width:340px; top:178px; text-align:center; font-size:26px; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; opacity:0; transition:opacity .18s; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  /* Ahorro de memoria: la sombra solo existe en la tarjeta enfocada (cada una era una capa de GPU) */
  .tile:not(.focus) .sh { display:none; }
  .tile.focus { z-index:2; }
  .tile.focus .card { transform:scale(1); }
  .tile.focus .spec, .tile.focus .sh, .tile.focus .lbl { opacity:1; }
  .tile.moving .card { animation:jiggle .26s ease-in-out infinite alternate; }
  @keyframes jiggle { from { transform:scale(1) rotate(-1.6deg); } to { transform:scale(1) rotate(1.6deg); } }
  .tile.moving .lbl { opacity:0; }
  #grid.editing .tile .card { opacity:.72; }
  #grid.editing .tile.moving .card { opacity:1; }

  /* ---------- Pista inferior ---------- */
  #hint { position:absolute; left:50%; top:60px; transform:translate(-50%,20px); padding:16px 34px; border-radius:40px; font-size:26px;
    opacity:0; transition:opacity .25s, transform .3s var(--ease); z-index:6; background:rgba(40,40,48,.82); border:1.5px solid var(--glassBorder); }
  #hint.on { opacity:1; transform:translate(-50%,0); }
  .kb { display:inline-block; min-width:44px; text-align:center; border:2px solid rgba(255,255,255,.5); border-radius:10px; padding:0 10px; margin:0 8px; font-weight:700; }

  /* ---------- Menú contextual (popover de cristal) ---------- */
  #menu { position:absolute; width:520px; border-radius:36px; padding:14px; background:rgba(44,44,52,.9); border:1.5px solid var(--glassBorder);
    box-shadow:0 40px 80px rgba(0,0,0,.5); opacity:0; transform:scale(.9); transform-origin:50% 0; transition:opacity .18s, transform .22s var(--ease); z-index:8; pointer-events:none; }
  #menu.on { opacity:1; transform:scale(1); }
  #menu.up { transform-origin:50% 100%; }
  .mi { display:flex; align-items:center; height:76px; padding:0 26px; border-radius:24px; font-size:29px; font-weight:500; transition:background .12s, transform .15s var(--ease); }
  .mi svg { margin-right:22px; flex:none; }
  .mi.focus { background:#fff; color:#000; transform:scale(1.03); }
  .mi.focus svg { stroke:#000; }
  .mi.red { color:#ff453a; }
  .mi.red.focus svg { stroke:#ff453a; }
  .msep { height:1.5px; background:rgba(255,255,255,.14); margin:8px 20px; }

  /* ---------- Ajustes (pantalla completa, estilo tvOS) ---------- */
  #set { opacity:0; pointer-events:none; transition:opacity .3s; z-index:10; visibility:hidden; }
  #set.on { visibility:visible; }
  /* .gone = retirado del todo tras la animación de cierre: no ocupa memoria gráfica */
  .gone { display:none !important; }
  #set.on { opacity:1; }
  #set .ttl { position:absolute; left:0; width:1920px; top:66px; text-align:center; font-size:44px; font-weight:700; }
  #set .big { position:absolute; left:250px; top:330px; width:420px; height:420px; border-radius:96px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#8e8e93,#48484a); box-shadow:0 40px 90px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.3); overflow:hidden; }
  #set .big img { width:100%; height:100%; object-fit:cover; }
  #set .bigcap { position:absolute; left:160px; width:600px; top:790px; text-align:center; font-size:26px; color:var(--dim); line-height:1.45; }
  #set .lst { position:absolute; left:920px; top:150px; width:880px; height:900px; overflow:hidden; }
  #set .in { transition:transform .3s var(--ease); padding:24px 24px 60px; }
  .grp { font-size:24px; color:var(--faint); font-weight:600; margin:28px 30px 12px; text-transform:uppercase; letter-spacing:1.5px; }
  .grp:first-child { margin-top:0; }
  .rw { display:flex; align-items:center; justify-content:space-between; min-height:86px; padding:0 32px; border-radius:22px; margin-bottom:8px;
    font-size:30px; font-weight:500; background:rgba(255,255,255,.075); transition:background .12s, color .12s, transform .18s var(--ease), box-shadow .18s; }
  .rw .l { display:flex; align-items:center; min-width:0; }
  .rw .l span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rw .v { color:var(--dim); display:flex; align-items:center; white-space:nowrap; margin-left:24px; }
  .rw .chev { margin-left:16px; opacity:.55; font-size:40px; line-height:1; }
  .rw .ck { color:#0a84ff; font-size:34px; font-weight:700; }
  .rw .th { width:96px; height:58px; border-radius:12px; margin-right:24px; flex:none; background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:30px; font-weight:700; color:#fff; }
  .rw .th img { max-width:70%; max-height:70%; }
  .rw .th img.full { max-width:100%; max-height:100%; height:100%; }
  .rw .ext { margin-left:16px; opacity:.55; font-size:28px; }
  .rw.focus .adj:before { content:'‹  '; } .rw.focus .adj:after { content:'  ›'; }
  .rw.info { background:transparent; }
  .rw.focus { background:#fff; color:#000; transform:scale(1.035); box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .rw.focus .v { color:rgba(0,0,0,.55); }
  .rw.red { color:#ff453a; }

  /* ---------- Centro de control ---------- */
  #cc { position:absolute; left:1240px; top:0; width:680px; height:1080px; background:var(--panel); border-left:1.5px solid var(--glassBorder);
    padding:60px 50px; transform:translateX(700px); transition:transform .4s var(--ease); z-index:9; }
  #cc.on { transform:translateX(0); }
  #cc .tm { font-size:108px; font-weight:300; letter-spacing:-3px; line-height:1; }
  #cc .dt { font-size:30px; color:var(--dim); margin:10px 0 34px; }
  .ccg { position:relative; }
  .cct { position:absolute; width:280px; height:150px; border-radius:34px; background:rgba(255,255,255,.1); padding:24px 28px;
    display:flex; flex-direction:column; justify-content:space-between; font-size:26px; font-weight:600; transition:background .12s, color .12s, transform .18s var(--ease); }
  .cct.wide { width:580px; height:250px; }
  .cct .s { font-size:22px; font-weight:500; color:var(--dim); }
  .cct.focus { background:#fff; color:#000; transform:scale(1.05); }
  .cct.focus .s { color:rgba(0,0,0,.55); }
  .cct.focus > svg { stroke:#000; }
  /* El tiempo lleva iconos blancos: al enfocarlo se aclara el cristal en vez de volverse blanco */
  .cct.wide.focus { background:rgba(255,255,255,.3); color:#fff; }
  .cct.wide.focus .s { color:rgba(255,255,255,.8); }
  .wbig { display:flex; align-items:center; }
  .wbig .t { font-size:76px; font-weight:300; margin-left:18px; letter-spacing:-2px; }
  .wbig .d { margin-left:26px; font-size:26px; line-height:1.4; }
  .hrs { display:flex; justify-content:space-between; font-size:21px; text-align:center; }
  .hrs div { width:80px; } .hrs svg { display:block; margin:4px auto; }

  /* ---------- Notificación ---------- */
  #toast { position:absolute; right:70px; top:136px; padding:20px 30px; border-radius:28px; font-size:27px; font-weight:500; max-width:700px;
    background:rgba(44,44,52,.92); border:1.5px solid var(--glassBorder); opacity:0; transform:translateY(-16px); transition:opacity .2s, transform .3s var(--ease); z-index:20; }
  #toast.on { opacity:1; transform:translateY(0); }
  body.incc #toast { right:740px; }

  /* ---------- Transición al abrir una app (como el zoom de tvOS) ---------- */
  #launch { opacity:0; z-index:15; pointer-events:none; display:flex; align-items:center; justify-content:center; transition:opacity .28s ease; }
  #launch.on { opacity:1; }
  #launch > * { transform:scale(.8); transition:transform .4s var(--ease); }
  #launch.on > * { transform:scale(1.6); }
  #launch img { max-width:300px; max-height:300px; }

  /* ---------- Salvapantallas con fotos (Ken Burns) ---------- */
  #saver { background:#000; z-index:30; opacity:0; pointer-events:none; transition:opacity 1.4s; overflow:hidden; }
  #saver.on { opacity:1; }
  .sv { background-size:cover; background-position:center; opacity:0; transition:opacity 2s ease; }
  .sv.on { opacity:1; }
  .kb1 { animation:kb1 34s linear forwards; } .kb2 { animation:kb2 34s linear forwards; }
  .kb3 { animation:kb3 34s linear forwards; } .kb4 { animation:kb4 34s linear forwards; }
  @keyframes kb1 { from { transform:scale(1.02) translate(0,0); } to { transform:scale(1.14) translate(-50px,-20px); } }
  @keyframes kb2 { from { transform:scale(1.14) translate(-40px,20px); } to { transform:scale(1.02) translate(0,0); } }
  @keyframes kb3 { from { transform:scale(1.04) translate(40px,0); } to { transform:scale(1.15) translate(-30px,10px); } }
  @keyframes kb4 { from { transform:scale(1.15) translate(30px,-20px); } to { transform:scale(1.03) translate(-20px,0); } }
  #sInfo { position:absolute; top:70px; right:90px; text-align:right; text-shadow:0 2px 20px rgba(0,0,0,.5); color:rgba(255,255,255,.78); }
  #sInfo .t { font-size:96px; font-weight:300; letter-spacing:-2px; line-height:1; }
  #sInfo .w { font-size:30px; margin-top:10px; display:flex; align-items:center; justify-content:flex-end; }
  #sInfo .w svg { margin-right:10px; }
  #sCred { position:absolute; left:80px; bottom:60px; font-size:24px; color:rgba(255,255,255,.5); text-shadow:0 2px 12px rgba(0,0,0,.6); }
</style>
</head>

</div>

};

  s = s || 34;
  var p = {
    move:'<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',

var ITEMS = {};
function hue(str){ var h = 0; for(var i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 360; return h; }
function addApp(id, name, icon){
  var b = BRAND[id] || {}, h = hue(id);
  var it = ITEMS[id] = { key:id, id:id, name:name, icon:(b.noIcon ? '' : icon || ''), svg:b.svg, fg: b.bg === '#fff' ? '#000' : '#fff',

// Los iconos de Samsung son cuadrados con su propio fondo: se lee el color del borde para que la
// tarjeta entera tenga ese color y el icono quede a sangre, como en tvOS.
var ICONBG = load('iconBg2', {});
function sampleIcon(it){
  if(!it.icon || ICONBG[it.icon] !== undefined) return;
  var i = new Image();
  i.onload = function(){
    var col = '';
    try {
      var w = i.naturalWidth, h = i.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.drawImage(i, 0, 0);
      var px = function(a, b){ var d = x.getImageData(Math.round(a), Math.round(b), 1, 1).data; return d[3] > 230 ? 'rgb('+d[0]+','+d[1]+','+d[2]+')' : ''; };
      // Esquinas opacas = icono cuadrado con fondo. Si no, se mira al 20 % hacia dentro: un cuadrado redondeado
      // es opaco ahí y un logo con forma (el rombo de Stremio) no, y entonces se queda el color de marca.
      col = px(1,1) || px(w-2,1) || px(1,h-2) || px(w-2,h-2) || (px(w*.2,h*.2) && px(w*.8,h*.8) ? px(w*.2,h*.2) : '');
    } catch(e){ LOG('icono', it.name, e.message); }
    ICONBG[it.icon] = col; save('iconBg2', ICONBG);
    if(col && ITEMS[it.key] === it){ it.bg = col; it.full = true; var t = TILES[it.key]; if(t){ var cd = t.querySelector('.card'); cd.style.background = col; var im = cd.querySelector('img'); if(im) im.className = 'full'; } }
  };
  i.onerror = function(){ ICONBG[it.icon] = ''; };
  i.src = it.icon;
}

// La tele tarda unos segundos en enumerar apps: se pinta al instante con la lista en caché
// y se repinta solo si ha cambiado algo.
function loadApps(done){
  var cache = load('appsCache', null), sig = JSON.stringify(cache || []);
  ITEMS = {};
  if(cache) cache.forEach(function(a){ addApp(a[0], a[1], a[2]); });
  else KNOWN.forEach(function(k){ addApp(k[0], k[1], ''); });
  addFixed(); done();
  if(!hasTizen) return;
  try {
    tizen.application.getAppsInfo(function(list){
      var known = {}, now = [];
      KNOWN.forEach(function(k){ known[k[0]] = k[1]; });
      list.forEach(function(a){
        // Solo apps de la tienda (paquete de 10 caracteres) o las conocidas; el resto son servicios del sistema
        if(!a.show || !a.name || !(known[a.id] || /^[A-Za-z0-9]{10}\.[A-Za-z]/.test(a.id)) || /service/i.test(a.id) || BLOCK.test(a.id)) return;
        now.push([a.id, known[a.id] || a.name, a.iconPath]);
      });
      now.sort(function(a, b){ return a[0] < b[0] ? -1 : 1; });
      save('appsCache', now);
      if(JSON.stringify(now) === sig) return;
      ITEMS = {}; now.forEach(function(a){ addApp(a[0], a[1], a[2]); }); addFixed(); done();
    }, function(e){ LOG('getAppsInfo', e.message); });
  } catch(e){ LOG('getAppsInfo', e.message); }
}

function iconHTML(it){

}
function letter(l, c){ return '<span style="font-size:84px;font-weight:700;color:'+(c||'#fff')+'">'+esc(l)+'</span>'; }

var L = [], TILES = {}, f = 0, onPill = false, moving = false;
function visible(){
  var keys = Object.keys(ITEMS).filter(function(k){ return S.hidden.indexOf(k) < 0; });
  keys.sort(function(a, b){
    var ia = S.order.indexOf(a), ib = S.order.indexOf(b);
    if(ia < 0 && ib < 0) return ITEMS[a].name.localeCompare(ITEMS[b].name);
    if(ia < 0) return 1; if(ib < 0) return -1; return ia - ib;
  });
  return keys;
}
function pos(i){ return { x: LEFT + (i % COLS) * (TW + GX), y: ROW0 + Math.floor(i / COLS) * PITCH }; }
function row(i){ return Math.floor(i / COLS); }
function pageY(i){ return row(i) === 0 ? 0 : -(ROW0 + row(i)*PITCH - 330); }
function build(){
  var keepKey = L[f], g = $('grid');
  L = visible();
  // Reutilizar los nodos existentes para que al reordenar se deslicen en vez de parpadear
  var keep = {};
  L.forEach(function(k, i){
    var t = TILES[k], p = pos(i);
    if(!t){
      var it = ITEMS[k];
      t = document.createElement('div'); t.className = 'tile';
      t.innerHTML = '<div class="sh"></div><div class="card" style="background:'+it.bg+'">'+iconHTML(it)+'<div class="spec"></div></div><div class="lbl">'+esc(it.name)+'</div>';
      t.style.transition = 'none'; t.style.transform = 'translate('+p.x+'px,'+p.y+'px)';
      g.appendChild(t); TILES[k] = t; t.offsetWidth; t.style.transition = '';
      sampleIcon(it);
    }
    t.style.transform = 'translate('+p.x+'px,'+p.y+'px)';
    keep[k] = 1;
  });
  Object.keys(TILES).forEach(function(k){ if(!keep[k]){ g.removeChild(TILES[k]); delete TILES[k]; } });
  var d = $('dock'); d.style.left = (LEFT-30)+'px'; d.style.top = (ROW0-28)+'px';
  d.style.width = (COLS*TW + (COLS-1)*GX + 60)+'px'; d.style.height = (TH+56)+'px';
  var ni = L.indexOf(keepKey);
  focus(ni >= 0 ? ni : Math.min(f, L.length-1), true);
}
function focus(i, instant){
  if(onPill){ $('pill').classList.remove('focus'); onPill = false; }
  var old = TILES[L[f]]; if(old) old.classList.remove('focus', 'moving');
  f = Math.max(0, Math.min(L.length-1, i));
  var t = TILES[L[f]]; if(!t) return;
  t.classList.add('focus');
  if(moving) t.classList.add('moving');
  $('page').style.transform = 'translateY('+pageY(f)+'px)';
  document.body.classList.toggle('deep', row(f) > 0);
  shelfFor(ITEMS[L[f]], instant);
  bumpIdle();
}
function focusPill(){ var t = TILES[L[f]]; if(t) t.classList.remove('focus'); onPill = true; $('pill').classList.add('focus'); }

// Códigos de cielo de AEMET -> códigos WMO equivalentes, para reutilizar los mismos iconos
function aemetToWmo(c){
  c = parseInt(c, 10);
  if(c === 11) return 0;
  if(c === 12 || c === 13 || c === 17) return 2;
  if(c >= 14 && c <= 16) return 3;
  if(c >= 81 && c <= 83) return 45;
  if((c >= 33 && c <= 36) || (c >= 71 && c <= 74)) return 71;
  if((c >= 51 && c <= 54) || (c >= 61 && c <= 64)) return 95;
  if((c >= 23 && c <= 26) || (c >= 43 && c <= 46)) return 61;
  return 3;
}
function getXML(url, ok, ko){

  x.onload = function(){ if(x.status === 200 && x.responseXML) ok(x.responseXML); else if(ko) ko(new Error('AEMET '+x.status)); };
  x.onerror = x.ontimeout = function(){ if(ko) ko(new Error('sin conexión')); };
  x.send();
}
function fetchAemet(name, ine, ok, ko){
  getXML('https://www.aemet.es/xml/municipios_h/localidad_h_'+ine+'.xml', function(xh){
    var n = new Date(), today = n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()), rows = [];
    [].forEach.call(xh.querySelectorAll('dia'), function(d){
      var temps = {};
      [].forEach.call(d.querySelectorAll('temperatura'), function(t){ temps[t.getAttribute('periodo')] = parseFloat(t.textContent); });
      [].forEach.call(d.querySelectorAll('estado_cielo'), function(e){
        var per = e.getAttribute('periodo'), v = e.textContent;
        if(temps[per] === undefined || !v) return;
        rows.push({ k:d.getAttribute('fecha')+' '+per, h:per, t:temps[per], code:aemetToWmo(v), day: v.indexOf('n') < 0 ? 1 : 0, desc:e.getAttribute('descripcion') });
      });
    });
    var nowK = today+' '+pad(n.getHours()), cur = null, next = [];
    rows.forEach(function(r){ if(r.k <= nowK) cur = r; else if(next.length < 6 && (!next.length || next[next.length-1].k !== r.k)) next.push(r); });
    cur = cur || rows[0];
    if(!cur) return ko(new Error('AEMET sin datos'));
    getXML('https://www.aemet.es/xml/municipios/localidad_'+ine+'.xml', function(xd){
      var d0 = xd.querySelector('dia'), mx = d0 && d0.querySelector('temperatura maxima'), mn = d0 && d0.querySelector('temperatura minima');
      ok({ at:Date.now(), loc:{ name:name, fixed:true, src:'AEMET' }, cur:{ temperature_2m:cur.t, weather_code:cur.code, is_day:cur.day, desc:cur.desc },
        max: mx ? parseFloat(mx.textContent) : cur.t, min: mn ? parseFloat(mn.textContent) : cur.t,
        hours: next.map(function(r){ return [r.h, r.t, r.code, r.day]; }) });
    }, ko);
  }, ko);
}

        hours: d.hourly.time.map(function(t, i){ return [t.slice(11,13), d.hourly.temperature_2m[i], d.hourly.weather_code[i], d.hourly.is_day[i]]; }).slice(1) };

      focusFx:function(){ setBigIcon('<img src="photos/mid/'+PHOTOS[i][0]+'.jpg">', 'Foto de '+esc(p[1])+' · Unsplash'); },
      ok:function(){ S.photo = i; persist(); showPhoto(i); popSettings(); } };
  }) }] };
}
function weatherPage(){
  var cityRows = [['auto','Automático (por tu conexión)']].concat(CITIES.map(function(c){ return [c[0], c[0]]; }));
  return { title:'Tiempo', icon: W ? wIcon(W.cur.weather_code, W.cur.is_day, 300) : bigG('therm'),
    cap: W ? esc(W.loc.name||'')+' · '+esc(wdesc())+' · '+temp(W.cur.temperature_2m)+'<br>Datos: '+(W.loc.src || 'Open-Meteo') : 'Sin datos todavía', groups:[
    { rows:[
      { l:'Ubicación', v:function(){ return S.city ? S.city.name : 'Automático'; }, page:function(){
        return choice('Ubicación', bigG('pin'), 'Ciudades: datos de AEMET<br>Automático: Open-Meteo', cityRows,
          function(){ return S.city ? S.city.name : 'auto'; },
          function(v){ S.city = null; CITIES.forEach(function(c){ if(c[0]===v) S.city = { name:c[0], lat:c[1], lon:c[2] }; }); refreshWeather(true); }); } },
      { l:'Fuente de datos', v:function(){ return S.city && cityIne(S.city.name) ? 'AEMET' : 'Open-Meteo'; }, info:true },
      { l:'Unidades', v:function(){ return S.units === 'F' ? 'Fahrenheit (°F)' : 'Celsius (°C)'; }, ok:function(){ S.units = S.units === 'F' ? 'C' : 'F'; persist(); paintWeather(); } },
      { l:'Mostrar en la pantalla de inicio', v:function(){ return S.showWeather ? 'Sí' : 'No'; }, ok:function(){ S.showWeather = !S.showWeather; persist(); paintWeather(); } },
      { l:'Actualizar ahora', ok:function(){ refreshWeather(true); toast('Actualizando el tiempo…'); } } ]}
  ]};
}
function hiddenPage(){
  var keys = Object.keys(ITEMS).sort(function(a, b){ return ITEMS[a].name.localeCompare(ITEMS[b].name); });
  return { title:'Apps visibles', icon:bigG('grid'), cap:'Las apps sin marcar no aparecen<br>en la pantalla de inicio.', groups:[{ rows: keys.map(function(k){
    var it = ITEMS[k];
    return { l:it.name, thumb:itemThumb(it), check:function(){ return S.hidden.indexOf(k) < 0; },
      ok:function(){
        var i = S.hidden.indexOf(k);
        if(i >= 0) S.hidden.splice(i, 1);
        else if(k === SETTINGS_ITEM.key){ toast('Ajustes siempre está visible'); return; }
        else S.hidden.push(k);
        persist(); build();
      } };
  }) }] };
}
function resetPage(){
  return { title:'Restablecer', icon:bigG('reset'), cap:'Vuelve al orden original, muestra<br>todas las apps y quita la foto fija.', groups:[{ rows:[
    { l:'Restablecer pantalla de inicio', red:true, ok:function(){ S.order = DEFAULT_ORDER.slice(); S.hidden = DEFAULT_HIDDEN.slice(); S.photo = -1; persist(); build(); popSettings(); toast('Pantalla de inicio restablecida'); } },
    { l:'Cancelar', ok:popSettings } ]}] };
}
function channelPage(){
  return choice('Canal al abrir TV', small(SVG.tv, 260), CHANNELS.length ? CHANNELS.length+' canales de antena' : 'Sin canales sintonizados',
    [['last','Último visto']].concat(CHANNELS.map(function(c){ return [c.name, c.name]; })),
    function(){ return S.channel; }, function(v){ S.channel = v; });
}
function portPage(it){
  return choice(it.name, small(SVG[it.svg], 240), 'Puerto HDMI donde está conectada', [[1,'HDMI 1'],[2,'HDMI 2'],[3,'HDMI 3'],[4,'HDMI 4']],
    function(){ return it.source.number; }, function(v){ it.source.number = v; S.ports[it.key] = v; });
}
function infoPage(){
  var r = function(l, v){ return { l:l, v:function(){ return v; }, info:true }; };
  return { title:'Información', icon:bigG('info'), cap:'', groups:[
    { rows:[ r('Modelo', MODEL || '—'), r('Sistema', 'Tizen '+(PLATFORM || '—')), r('Mi Inicio', VERSION),
      r('Apps', (Object.keys(ITEMS).length - INPUTS.length - 1)+' instaladas'), r('Tiempo', 'AEMET · Open-Meteo'), r('Salvapantallas', 'Imágenes de la NASA') ]},
    { h:'Fotos (Unsplash)', rows: PHOTOS.map(function(p, i){ return { l:p[1], thumb:photoThumb(i), info:true }; }) }
  ]};
}
function sortAZ(){ S.order = L.slice().sort(function(a, b){ return ITEMS[a].name.localeCompare(ITEMS[b].name); }); persist(); build(); }

function openSettings(page){
  closeMenu();
  var root = rootPage(); root.make = rootPage;
  SET = [{ p:root, i:0 }];
  if(page) SET.push({ p:page, i:0 });
  document.body.classList.add('over', 'inset'); panelShow($('set')); renderSettings();
}
function closeSettings(){ SET = null; panelHide($('set')); document.body.classList.remove('over', 'inset'); }
function popSettings(){
  if(!SET) return;
  SET.pop();
  if(!SET.length){ closeSettings(); return; }
  // Regenerar la página para que los valores (y el icono grande) reflejen el cambio
  var top = SET[SET.length-1], fresh = top.p.make ? top.p.make() : null;
  if(fresh){ fresh.make = top.p.make; top.p = fresh; }
  renderSettings();
}
function flatRows(p){ var a = []; p.groups.forEach(function(g){ g.rows.forEach(function(r){ a.push(r); }); }); return a; }
function setBigIcon(html, cap){ $('setI').innerHTML = html; if(cap !== undefined) $('setC').innerHTML = cap; }
function pushPage(maker){ var p = maker(); p.make = maker; SET.push({ p:p, i:0 }); renderSettings(); }
function renderSettings(){
  var top = SET[SET.length-1], p = top.p, h = '', n = 0;
  $('setT').textContent = p.title; setBigIcon(p.icon, p.cap || '');
  p.groups.forEach(function(g){
    if(g.h) h += '<div class="grp">'+esc(g.h)+'</div>';
    g.rows.forEach(function(r){
      var v = r.check ? (r.check() ? '<span class="ck">✓</span>' : '') : (r.v ? esc(r.v()) : '');
      h += '<div class="rw'+(r.info?' info':'')+(r.red?' red':'')+(n===top.i?' focus':'')+'"><span class="l">'+(r.thumb||'')+'<span>'+esc(r.l)+'</span></span>'+
           '<span class="v">'+(r.adj ? '<span class="adj">'+v+'</span>' : v)+(r.page ? '<span class="chev">›</span>' : '')+(r.ext ? '<span class="ext">↗</span>' : '')+'</span></div>';
      n++;
    });
  });
  $('setL').innerHTML = h; scrollSettings();
  var fr = flatRows(p)[top.i]; if(fr && fr.focusFx) fr.focusFx();
}
function scrollSettings(){
  var el = $('setL').querySelector('.rw.focus'); if(!el) return;
  $('setL').style.transform = 'translateY('+(-Math.max(0, el.offsetTop - 430))+'px)';
}
function setKey(k){
  var top = SET[SET.length-1], rows = flatRows(top.p), r = rows[top.i];
  if(k===38 || k===40){
    var i = top.i + (k===40 ? 1 : -1);
    if(i < 0 || i >= rows.length) return;
    top.i = i;
    var els = $('setL').querySelectorAll('.rw');
    for(var j=0;j<els.length;j++) els[j].classList.toggle('focus', j===i);
    scrollSettings();
    if(rows[i].focusFx) rows[i].focusFx();
  }
  else if(k===13){
    if(r.page) pushPage(r.page);
    else if(r.ok){ r.ok(); if(SET && SET[SET.length-1] === top) renderSettings(); }
  }
  else if((k===37 && r.left) || (k===39 && r.right)){ (k===37 ? r.left : r.right)(); renderSettings(); }
  else if(k===10009) popSettings();
}

// ---------- Centro de control ----------
var CC = null, ci = 0;
function ccItems(){
  var a = [{ w:true, act:function(){ refreshWeather(true); toast('Actualizando el tiempo…'); } }];
  a.push({ g:'saver', t:'Salvapantallas', s:'Iniciar ahora', act:function(){ closeCC(); saverOn(); } });
  a.push({ g:'next', t:'Fondo', s:'Siguiente foto', act:function(){ S.photo = -1; persist(); showPhoto(photoIdx + 1); } });
  INPUTS.forEach(function(it){
    a.push({ g: it.source.type==='TV' ? 'tv' : 'game', t:it.name.replace('Nintendo ','').replace(' Series X',''),
      s: it.source.type==='TV' ? 'TDT' : 'HDMI '+it.source.number+(SRC_ON[it.source.number] ? ' · Conectada' : ''),
      act:function(){ closeCC(); openSource(it); } });
  });
  a.push({ g:'settings', t:'Ajustes', s:'Mi Inicio', act:function(){ closeCC(); openSettings(); } });
  return a;
}
function openCC(){ closeMenu(); ci = 0; renderCC(); panelShow($('cc')); document.body.classList.add('over', 'incc'); }
function closeCC(){ CC = null; panelHide($('cc')); document.body.classList.remove('over', 'incc'); if(onPill) focus(f); }
function renderCC(){
  CC = ccItems();
  var h = '', y = 0, x = 0;
  CC.forEach(function(o, i){
    var cls = 'cct'+(o.w?' wide':'')+(i===ci?' focus':'');
    if(o.w){
      var inner = W ? '<div class="wbig">'+wIcon(W.cur.weather_code, W.cur.is_day, 90)+'<span class="t">'+temp(W.cur.temperature_2m)+'</span><span class="d">'+
        esc(W.loc.name||'')+'<br><span class="s">'+esc(wdesc())+'<br>Máx. '+temp(W.max)+'  Mín. '+temp(W.min)+'</span></span></div>'+
        '<div class="hrs">'+W.hours.map(function(hh){ return '<div><span class="s">'+hh[0]+' h</span>'+wIcon(hh[2], hh[3], 40)+temp(hh[1])+'</div>'; }).join('')+'</div>'
        : '<div>Tiempo</div><div class="s">Sin conexión todavía</div>';
      h += '<div class="'+cls+'" style="left:0;top:0">'+inner+'</div>'; y = 280;
    } else {
      h += '<div class="'+cls+'" style="left:'+(x*300)+'px;top:'+y+'px">'+G(o.g, 40)+'<div>'+esc(o.t)+'<div class="s">'+esc(o.s)+'</div></div></div>';
      x++; if(x === 2){ x = 0; y += 170; }
    }
  });
  $('ccG').innerHTML = h;
}
// Índices: 0 = tiempo (ancho); después pares de columnas (1,2), (3,4)...
function ccKey(k){
  var n = CC.length, col = ci === 0 ? 0 : (ci - 1) % 2;
  if(k===38) ci = ci <= 2 ? 0 : ci - 2;
  else if(k===40) ci = ci === 0 ? 1 : Math.min(n-1, ci + 2);
  else if(k===37){ if(ci > 0 && col === 1) ci--; else { closeCC(); return; } }
  else if(k===39){ if(ci > 0 && col === 0 && ci + 1 < n) ci++; }
  else if(k===13){ CC[ci].act(); if(CC) renderCC(); return; }
  else if(k===10009 || k===403){ closeCC(); return; }
  else return;
  // Solo se mueve el foco; redibujar todo el panel en cada tecla daba tirones en la tele
  var els = $('ccG').children;
  for(var i=0;i<els.length;i++) els[i].classList.toggle('focus', i===ci);
}

// ---------- Salvapantallas ----------
var idleT, saverIsOn = false, saverT, svLayer = 0, svIdx = 0, svCorner = 0;
function bumpIdle(){ clearTimeout(idleT); if(S.saver && !saverIsOn) idleT = setTimeout(saverOn, S.saver * 60000); }
function saverOn(){
  if(saverIsOn) return;
  if(document.hidden){ bumpIdle(); return; }
  saverIsOn = true; clearTimeout(idleT);
  closeMenu(); if(moving) endMove();
  svIdx = Math.floor(Math.random() * saverList().length); saverNext(); panelShow($('saver'));
  saverT = setInterval(saverNext, 30000);
}
// Lista de imágenes según el ajuste: [url, crédito]
function saverList(){
  var space = SPACE.map(function(x){ return ['photos/space/'+x[0]+'.jpg', 'Imagen: NASA']; });
  var land = PHOTOS.map(function(x, i){ return [photoURL(i), 'Foto de '+x[1]+' · Unsplash']; });
  if(S.saverSet === 'landscape') return land;
  if(S.saverSet === 'mix'){ var m = []; for(var i=0; i<Math.max(space.length, land.length); i++){ if(space[i]) m.push(space[i]); if(land[i]) m.push(land[i]); } return m; }
  return space;
}
function saverNext(){
  var list = saverList();
  svIdx = (svIdx + 1) % list.length;
  var next = svLayer ? $('svA') : $('svB'), prev = svLayer ? $('svB') : $('svA'), img = new Image(), idx = svIdx;
  img.onload = function(){
    if(!saverIsOn) return;
    next.className = 'fill sv'; next.offsetWidth;
    next.style.backgroundImage = 'url('+img.src+')';
    next.className = 'fill sv on kb'+(1 + Math.floor(Math.random()*4));
    prev.classList.remove('on'); svLayer = 1 - svLayer;
    // El texto cambia de esquina con cada foto para no marcar el OLED
    svCorner = 1 - svCorner;
    var i = $('sInfo'), c = $('sCred');
    i.style.right = svCorner ? '90px' : 'auto'; i.style.left = svCorner ? 'auto' : '90px';
    i.style.textAlign = svCorner ? 'right' : 'left'; $('sW').style.justifyContent = svCorner ? 'flex-end' : 'flex-start';
    c.textContent = list[idx][1]; c.style.left = svCorner ? '80px' : 'auto'; c.style.right = svCorner ? 'auto' : '80px';
  };
  img.src = list[svIdx][0];
}
function saverOff(){
  saverIsOn = false; panelHide($('saver'), 1500); clearInterval(saverT); bumpIdle(); checkPhoto();
  setTimeout(function(){ if(!saverIsOn){ $('svA').style.backgroundImage = $('svB').style.backgroundImage = ''; $('svA').className = $('svB').className = 'fill sv'; } }, 1600);
}

// ---------- Mando ----------
var okT = null, okAt = 0;
function registerKeys(){
  if(!(window.tizen && tizen.tvinputdevice)) return;
  ['ColorF0Red','ColorF1Green','ColorF2Yellow','ColorF3Blue','MediaPlayPause'].forEach(function(n){ try { tizen.tvinputdevice.registerKey(n); } catch(e){ LOG('key', n, e.message); } });
}
function homeNav(k){
  if(onPill){
    if(k===40 || k===10009) focus(f);
    else if(k===13) openCC();
    return;
  }
  var c = f % COLS;
  if(k===37){ if(c > 0) focus(f-1); }
  else if(k===39){ if(c < COLS-1 && f+1 < L.length) focus(f+1); }
  else if(k===38){ if(row(f) === 0) focusPill(); else focus(f - COLS); }
  else if(k===40){ if(f + COLS < L.length) focus(f + COLS); else if(row(L.length-1) > row(f)) focus(L.length-1); }
  else if(k===10009){ if(row(f) > 0) focus(f % COLS); else saverOn(); }    // como tvOS: VOLVER sube; arriba del todo, salvapantallas
}
document.addEventListener('keydown', function(e){
  var k = e.keyCode;
  if(k===10009 || (k>=37 && k<=40) || k===13) e.preventDefault();
  if(saverIsOn){ saverOff(); return; }      // cualquier tecla despierta
  bumpIdle();
  if(k===13 && e.repeat) return;            // las repeticiones de OK mantenido no cuentan
  if(SET){ setKey(k); return; }
  if(CC){ ccKey(k); return; }
  if(MENU){ menuKey(k); return; }
  if(moving){ moveKey(k); return; }
  if(k===13){
    if(onPill){ homeNav(13); return; }
    if(okT) return;
    // mantener OK => menú contextual; soltar antes => abrir
    okAt = Date.now();
    okT = setTimeout(function(){ okT = 'long'; openMenu(); }, 550);
    return;
  }
  if(k===405){ if(!onPill) openMenu(); return; }   // amarillo
  if(k===403){ openCC(); return; }                 // rojo
  if(k===406){ openSettings(); return; }           // azul
  homeNav(k);
});
document.addEventListener('keyup', function(e){
  if(e.keyCode !== 13) return;
  if(okT && okT !== 'long'){
    clearTimeout(okT); okT = null;
    if(!L[f] || SET || CC || MENU || moving) return;
    // Si el temporizador se retrasó (tele ocupada), la duración real de la pulsación manda
    if(Date.now() - okAt >= 550) openMenu(); else activate(ITEMS[L[f]]);
    return;
  }
  okT = null;
});
document.addEventListener('visibilitychange', function(){
  // Al pasar a segundo plano se quita ya la animación de apertura, para que no se vea al volver
  if(document.hidden){ var l = $('launch'); l.style.transition = 'none'; l.classList.remove('on'); l.offsetWidth; l.style.transition = ''; clearTimeout(launchT); return; }
  launchDone(); applySamsungSaver(); rememberChannel();
  refreshSources(); bumpIdle(); checkPhoto(); refreshWeather();
  loadApps(build);   // por si se ha instalado o desinstalado alguna app
});

// ---------- Reloj ----------
function tick(){
  var n = new Date(), t = pad(n.getHours())+':'+pad(n.getMinutes());
  var d = n.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'}); d = d.charAt(0).toUpperCase() + d.slice(1);
  $('pillT').textContent = t; $('sT').textContent = t; $('ccT').textContent = t; $('ccD').textContent = d;
}

// ---------- Arranque ----------
var MODEL = '', PLATFORM = '';
try { MODEL = webapis.productinfo.getRealModel(); } catch(e){}
try { PLATFORM = tizen.systeminfo.getCapability('http://tizen.org/feature/platform.version'); } catch(e){}
try { if(!MODEL) tizen.systeminfo.getPropertyValue('BUILD', function(b){ MODEL = b.model; }); } catch(e){}
tick(); setInterval(tick, 5000);
registerKeys(); applySamsungSaver();
showPhoto(S.photo >= 0 ? S.photo : (photoDue() ? photoIdx + 1 : photoIdx), true);
loadChannels();
loadApps(build);
paintWeather(); refreshWeather();
refreshSources(); bumpIdle();
setInterval(refreshSources, 20000);
// La tele puede olvidar la orden: se repite cada minuto mientras Mi Inicio está a la vista
setInterval(function(){ if(!document.hidden) applySamsungSaver(); }, 60000);
setInterval(function(){ refreshWeather(); if(!saverIsOn) checkPhoto(); }, 5*60000);
</script>
