<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<script src="$WEBAPIS/webapis/webapis.js"></script>
<title>Mi Inicio</title>
<style>
  /* Chromium 85 (Tizen 6.5): nada de inset, :is, aspect-ratio ni otras novedades de CSS */
  :root { --dim:rgba(255,255,255,.66); --faint:rgba(255,255,255,.42); --ease:cubic-bezier(.2,.8,.2,1);
    --glass:rgba(255,255,255,.14); --glassBorder:rgba(255,255,255,.26); --panel:rgba(30,30,36,.95); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#000; color:#fff;
    font-family:"SamsungOne","Samsung One","SF Pro Display","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  /* Todo vive dentro de #root (1920x1080, recortado): si algo asoma fuera, la tele agranda el viewport y encoge la interfaz */
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; }
  .fill { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .gl { background:var(--glass); border:1.5px solid var(--glassBorder);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28), 0 20px 50px rgba(0,0,0,.25); }

  /* ---------- Fondo: dos capas de foto que se funden + capa difuminada ---------- */
  .ph { background-size:cover; background-position:center; opacity:0; transition:opacity 1.2s ease; will-change:opacity; }
  .ph.on { opacity:1; }
  #blur { background-size:cover; background-position:center; opacity:0; transition:opacity .5s ease; will-change:opacity; }
  body.deep #blur, body.over #blur { opacity:1; }
  #scrim { background:
      radial-gradient(1200px 600px at 0% 0%, rgba(0,0,0,.45), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
 }
  /* Capa fija: sin ella, al cambiar de fila el degradado se redibujaba en CPU (~400 ms de tirón, medido con trazas) */
  #scrim { will-change:transform; }
  /* Oscurecido aparte y animado solo con opacity (la GPU lo compone sin repintar) */
  #dim { background:rgba(0,0,0,.42); opacity:0; transition:opacity .5s ease; will-change:opacity; }
  body.deep #dim, body.over #dim { opacity:1; }

  /* ---------- Top Shelf ---------- */
  #shelf { position:absolute; left:100px; top:96px; width:1100px; transition:opacity .35s ease, transform .45s var(--ease); will-change:opacity, transform; }
  #shelfTitle { font-size:92px; font-weight:800; letter-spacing:-2px; line-height:1; text-shadow:0 4px 30px rgba(0,0,0,.35); }
  #shelfSub { margin-top:18px; font-size:30px; color:rgba(255,255,255,.85); text-shadow:0 2px 12px rgba(0,0,0,.5); display:flex; align-items:center; }
  body.deep #shelf { opacity:0; transform:translateY(-40px); }
  body.inset #shelf { transform:none; }

  /* ---------- Píldora superior derecha (tiempo · hora · perfil) ---------- */
  #pills { position:absolute; right:70px; top:50px; display:flex; align-items:center; z-index:4; transition:opacity .35s; }
  #pill, #inPill { height:64px; border-radius:32px; display:flex; align-items:center;
    font-size:27px; font-weight:600; transition:transform .2s var(--ease), background .2s, color .2s; }
  #pill { padding:0 8px 0 24px; }
  #inPill { padding:0 28px 0 22px; margin-right:18px; }
  #inPill svg { margin-right:12px; }
  #inPill.focus { background:rgba(255,255,255,.96); color:#000; transform:scale(1.08); }
  #pill .w { display:flex; align-items:center; margin-right:20px; }
  #pill .w svg { margin-right:8px; }
  #pill .av { width:48px; height:48px; border-radius:50%; margin-left:18px; background:linear-gradient(135deg,#5e5ce6,#bf5af2);
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#fff; }
  #pill.focus { background:rgba(255,255,255,.96); color:#000; transform:scale(1.08); }
  body.over #pills { opacity:0; }

  /* ---------- Widgets (en el hueco entre el título y las apps; páginas con ◀▶) ----------
     Sin will-change ni sombras grandes: son estáticos y solo cambia la clase .focus de un elemento. */
  #wb { position:absolute; left:100px; top:300px; width:1720px; height:400px; transition:opacity .35s ease, transform .45s var(--ease); }
  body.deep #wb { opacity:0; transform:translateY(-40px); }
  body.inset #wb, body.inbar #wb { opacity:0; }
  body.insheet #wb { opacity:.3; }
  .wpg { position:absolute; left:0; top:0; width:1720px; height:360px; display:flex; }
  .wg { height:360px; flex:none; margin-right:30px; border-radius:40px; padding:28px 32px; position:relative; overflow:hidden;
    transition:transform .2s var(--ease), box-shadow .2s; }
  .wg:last-child { margin-right:0; }
  /* Más oscuro que el cristal de las píldoras: el texto se lee igual sobre fotos claras */
  .wg.gl { background:rgba(16,18,26,.38); border-color:rgba(255,255,255,.22); }
  .wg h3 { font-size:22px; font-weight:600; color:var(--dim); letter-spacing:.4px; display:flex; align-items:center; height:30px; }
  .wg h3 svg { margin-right:10px; }
  .wg.focus { box-shadow:inset 0 0 0 3px #fff, 0 20px 50px rgba(0,0,0,.3); transform:scale(1.02); }
  #wbDots { position:absolute; left:0; width:1720px; top:378px; display:flex; justify-content:center; }
  .wdot { width:10px; height:10px; border-radius:5px; background:rgba(255,255,255,.4); margin:0 6px; transition:width .25s var(--ease), background .25s; }
  .wdot.on { width:30px; background:#fff; }
  /* Tiempo */
  .wxTop { display:flex; justify-content:space-between; align-items:flex-start; margin-top:4px; }
  .wxT { font-size:92px; font-weight:300; letter-spacing:-3px; line-height:1; }
  .wxD { text-align:right; font-size:24px; font-weight:600; }
  .wxD .s { color:var(--dim); font-weight:500; margin-top:6px; font-size:21px; }
  .wxH { display:flex; justify-content:space-between; margin-top:20px; padding-top:16px; border-top:1.5px solid rgba(255,255,255,.18); }
  .wxH div { width:70px; text-align:center; font-size:21px; color:var(--dim); }
  .wxH b { display:block; color:#fff; font-size:23px; font-weight:600; }
  .wxH svg { display:block; margin:6px auto; }
  /* Fichas (Entradas, Control, Sistema) */
  .chips { display:flex; flex-wrap:wrap; margin:16px -10px 0; }
  .chip { height:120px; margin:0 10px 16px; border-radius:30px; padding:0 22px; display:flex; align-items:center; position:relative;
    background:rgba(255,255,255,.1); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14); transition:background .14s, color .14s, transform .2s var(--ease); }
  .chip .ic { width:64px; height:64px; border-radius:50%; flex:none; margin-right:18px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.14); }
  .chip .n { font-size:27px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip .s { font-size:20px; font-weight:500; color:var(--dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip .dot { position:absolute; right:20px; top:20px; width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.22); }
  .chip .dot.on { background:#30d158; box-shadow:0 0 10px rgba(48,209,88,.8); }
  .chip.on .ic { background:#0a84ff; }
  .chip.focus { background:#fff; color:#000; transform:scale(1.05); }
  .chip.focus .s { color:rgba(0,0,0,.55); }
  .chip.focus .ic { background:rgba(0,0,0,.08); }
  .chip.focus.on .ic { background:#0a84ff; color:#fff; }
  .wbar { height:12px; border-radius:6px; background:rgba(255,255,255,.2); overflow:hidden; margin:10px 0 4px; }
  .wbar i { display:block; height:100%; background:#fff; border-radius:6px; transform-origin:0 50%; transition:transform .2s; }
  .chip.focus .wbar { background:rgba(0,0,0,.14); } .chip.focus .wbar i { background:#0a84ff; }
  .chip.focus .adj:before { content:'‹ '; } .chip.focus .adj:after { content:' ›'; }
  .stat { display:flex; margin:14px -8px 0; }
  .stat > div { flex:1; margin:0 8px; padding:16px 22px; border-radius:24px; background:rgba(255,255,255,.06); font-size:20px; color:var(--dim); }
  .stat b { display:block; color:#fff; font-size:25px; font-weight:600; margin-top:4px; white-space:nowrap; }

  /* ---------- Rejilla de apps ---------- */
  #page { position:absolute; left:0; top:0; width:1920px; height:1080px; transition:transform .5s var(--ease), opacity .3s; will-change:transform; }
  /* Con Ajustes abierto la pantalla de inicio desaparece; con el Centro de control queda atenuada */
  body.inset #page, body.inset #shelf { opacity:0; }
  body.insheet #page, body.insheet #shelf { opacity:.3; }
  /* Las columnas que quedan bajo el panel se ocultan (opacidad de capas ya existentes: no redibuja nada) */
  body.insheet .tile[data-c="4"], body.insheet .tile[data-c="5"] { opacity:0; }
  body.deep #pills { opacity:0; }
  #dock { position:absolute; border-radius:46px; transition:opacity .4s; }
  .tile { position:absolute; left:0; top:0; width:260px; height:156px; transition:transform .38s var(--ease); }
  /* La tarjeta se dibuja a tamaño enfocado (116%) y se reduce cuando no tiene foco: así nunca se
     pixela ni "salta" al ampliarse (el motor rasteriza a tamaño grande y solo escala hacia abajo). */
  .tile .card { position:absolute; left:-8%; top:-8%; width:116%; height:116%; border-radius:30px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; transform:scale(.862); transition:transform .2s var(--ease), opacity .2s;
    will-change:transform; backface-visibility:hidden; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 2px 0 rgba(255,255,255,.22); }
  .tile .card img { max-width:60%; max-height:62%; }
  .tile .card img.full { max-width:none; max-height:none; height:108%; }  /* recorta los marcos finos que traen algunos iconos */
  .tile .spec { position:absolute; left:0; top:0; width:100%; height:100%; border-radius:30px;
    background:linear-gradient(160deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,0) 42%); opacity:0; transition:opacity .2s; }
  .tile .sh { position:absolute; left:2%; top:14%; width:96%; height:96%; border-radius:30px; box-shadow:0 34px 60px rgba(0,0,0,.6);
    opacity:0; transition:opacity .2s; }
  .tile .lbl { position:absolute; left:-40px; width:340px; top:178px; text-align:center; font-size:26px; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; opacity:0; transition:opacity .18s; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  /* Ahorro de memoria: la sombra solo existe en la tarjeta enfocada (cada una era una capa de GPU) */
  .tile:not(.focus) .sh { display:none; }
  .tile.focus { z-index:2; }
  .tile.focus .card { transform:scale(1); }
  /* Brillo especular: una franja de luz recorre la tarjeta en la que te detienes. Empieza a los 350 ms: si pasas
     rápido por las tarjetas no llega a animarse (medido en la tele: la inclinación 3D bajaba a ~52 fps, esto no) */
  .tile .shine { position:absolute; top:-25%; left:-55%; width:40%; height:150%; pointer-events:none; opacity:0;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 50%, rgba(255,255,255,0) 100%);
    transform:translateX(0) skewX(-14deg); }
  .tile.focus .shine { animation:shine .95s .35s cubic-bezier(.3,.6,.3,1); }
  @keyframes shine { 0% { opacity:0; transform:translateX(0) skewX(-14deg); } 15% { opacity:1; }
    100% { opacity:0; transform:translateX(420%) skewX(-14deg); } }
  .tile.moving .shine { animation:none; }
  .tile.focus .spec, .tile.focus .sh, .tile.focus .lbl { opacity:1; }
  .tile.moving .card { animation:jiggle .26s ease-in-out infinite alternate; }
  @keyframes jiggle { from { transform:scale(1) rotate(-1.6deg); } to { transform:scale(1) rotate(1.6deg); } }
  .tile.moving .lbl { opacity:0; }
  #grid.editing .tile .card { opacity:.72; }
  #grid.editing .tile.moving .card { opacity:1; }

  /* ---------- Pista inferior ---------- */
  #hint { position:absolute; left:50%; top:60px; transform:translate(-50%,20px); padding:16px 34px; border-radius:40px; font-size:26px;
    opacity:0; transition:opacity .25s, transform .3s var(--ease); z-index:6; background:rgba(40,40,48,.82); border:1.5px solid var(--glassBorder); }
  #hint.on { opacity:1; transform:translate(-50%,0); }
  .kb { display:inline-block; min-width:44px; text-align:center; border:2px solid rgba(255,255,255,.5); border-radius:10px; padding:0 10px; margin:0 8px; font-weight:700; }

  /* ---------- Menú contextual (popover de cristal) ---------- */
  #menu { position:absolute; width:520px; border-radius:36px; padding:14px; background:rgba(44,44,52,.9); border:1.5px solid var(--glassBorder);
    box-shadow:0 40px 80px rgba(0,0,0,.5); opacity:0; transform:scale(.9); transform-origin:50% 0; transition:opacity .18s, transform .22s var(--ease); z-index:8; pointer-events:none; }
  #menu.on { opacity:1; transform:scale(1); }
  #menu.up { transform-origin:50% 100%; }
  .mi { display:flex; align-items:center; height:76px; padding:0 26px; border-radius:24px; font-size:29px; font-weight:500; transition:background .12s, transform .15s var(--ease); }
  .mi svg { margin-right:22px; flex:none; }
  .mi.focus { background:#fff; color:#000; transform:scale(1.03); }
  .mi.focus svg { stroke:#000; }
  .mi.red { color:#ff453a; }
  .mi.red.focus svg { stroke:#ff453a; }
  .msep { height:1.5px; background:rgba(255,255,255,.14); margin:8px 20px; }

  /* .gone = retirado del todo tras la animación de cierre: no ocupa memoria gráfica */
  .gone { display:none !important; }

  /* ---------- Panel de Entradas (sube desde abajo; mismo cristal que Ajustes) ----------
     Solo se anima transform; la rejilla de detrás se oculta con opacidad (no redibuja). */
  #ibar { position:absolute; left:0; bottom:0; width:1920px; height:440px; z-index:10; overflow:hidden; border-radius:48px 48px 0 0;
    transform:translateY(480px); transition:transform .42s var(--ease); will-change:transform; padding:44px 70px 0;
    background:linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.04) 45%, rgba(255,255,255,.06) 100%), rgba(22,22,28,.9);
    border-top:1.5px solid rgba(255,255,255,.22); box-shadow:0 -30px 80px rgba(0,0,0,.45), inset 0 1.5px 0 rgba(255,255,255,.12); }
  #ibar.on { transform:translateY(0); }
  body.inbar #page { opacity:0; }
  .ibHead { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:30px; }
  .ibHead h2 { font-size:44px; font-weight:700; letter-spacing:-1px; }
  .ibHead span { font-size:22px; color:var(--dim); }
  #ibRow { display:flex; transition:transform .3s var(--ease); will-change:transform; padding:12px 6px; }
  .it { width:236px; height:206px; flex:none; margin-right:22px; border-radius:34px; padding:24px 24px 22px; display:flex; flex-direction:column; justify-content:space-between;
    background:rgba(255,255,255,.1); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14); transition:background .14s, color .14s, transform .2s var(--ease); position:relative; }
  .it .n { font-size:28px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .s { font-size:21px; font-weight:500; color:var(--dim); margin-top:4px; }
  .it .dot { position:absolute; right:24px; top:28px; width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.22); }
  .it .dot.on { background:#30d158; box-shadow:0 0 12px rgba(48,209,88,.8); }
  .it.cur { background:rgba(10,132,255,.55); }
  .it.focus { background:#fff; color:#000; transform:scale(1.07); }
  .it.focus .s { color:rgba(0,0,0,.55); }

  /* ---------- Panel de Ajustes (lateral, cristal estilo tvOS) ----------
     El cristal es la capa difuminada del fondo (body.over) vista a través de un fondo translúcido: sin backdrop-filter,
     que en la tele hunde los fotogramas. Solo se anima transform; al navegar solo cambia la clase .focus. */
  #sheet { position:absolute; right:0; top:0; width:820px; height:1080px; z-index:10; overflow:hidden;
    transform:translateX(870px); transition:transform .42s var(--ease); will-change:transform;
    background:linear-gradient(180deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.04) 38%, rgba(255,255,255,.07) 100%), rgba(22,22,28,.9);  /* recortar la rejilla costaba ~90 ms al abrir y cerrar */
    border-left:1.5px solid rgba(255,255,255,.22); box-shadow:-30px 0 80px rgba(0,0,0,.45), inset 1.5px 0 0 rgba(255,255,255,.1); }
  #sheet.on { transform:translateX(0); }
  #shIn { padding:54px 52px 80px; transition:transform .32s var(--ease); will-change:transform; }
  .shHead { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:34px; }
  .shTime { font-size:96px; font-weight:300; letter-spacing:-3px; line-height:1; }
  .shDate { font-size:28px; color:var(--dim); margin-top:10px; }
  .shW { text-align:right; font-size:26px; line-height:1.35; }
  .shW .t { display:flex; align-items:center; justify-content:flex-end; font-size:46px; font-weight:300; }
  .shW .t svg { margin-right:10px; }
  .shW .s { color:var(--dim); font-size:22px; }
  .qgrid { display:flex; flex-wrap:wrap; margin:0 -9px 22px; }
  .qt { width:161px; height:150px; margin:9px; border-radius:32px; padding:22px 20px; display:flex; flex-direction:column; justify-content:space-between;
    background:rgba(255,255,255,.1); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14); font-size:23px; font-weight:600;
    transition:background .14s, color .14s, transform .2s var(--ease); }
  .qt .s { font-size:19px; font-weight:500; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qt.on { background:#0a84ff; }
  .qt.on .s { color:rgba(255,255,255,.85); }
  .qt.focus { background:#fff; color:#000; transform:scale(1.07); }
  .qt.focus .s { color:rgba(0,0,0,.55); }
  .sld { display:flex; align-items:center; height:86px; padding:0 30px; border-radius:26px; background:rgba(255,255,255,.1); margin-bottom:22px;
    font-size:26px; font-weight:600; transition:background .14s, color .14s, transform .2s var(--ease); }
  .sld svg { flex:none; margin-right:20px; }
  .sld .bar { flex:1; height:12px; border-radius:6px; background:rgba(255,255,255,.22); margin:0 22px; overflow:hidden; }
  .sld .fillb { height:100%; background:#fff; border-radius:6px; transform-origin:0 50%; transition:transform .15s; }
  .sld .val { width:52px; text-align:right; }
  .sld.focus { background:#fff; color:#000; transform:scale(1.03); }
  .sld.focus .bar { background:rgba(0,0,0,.15); }
  .sld.focus .fillb { background:#0a84ff; }
  .mon { display:flex; margin:0 -8px 30px; }
  .mon > div { flex:1; margin:0 8px; padding:20px 24px; border-radius:24px; background:rgba(255,255,255,.06); font-size:21px; color:var(--dim); }
  .mon b { display:block; color:#fff; font-size:26px; font-weight:600; margin-top:6px; }
  .mon .mb { height:6px; border-radius:3px; background:rgba(255,255,255,.18); margin-top:12px; overflow:hidden; }
  .mon .mb i { display:block; height:100%; background:#30d158; transform-origin:0 50%; }
  .shBack { font-size:26px; color:var(--dim); margin-bottom:8px; }
  .shTitle { font-size:52px; font-weight:700; letter-spacing:-1px; margin-bottom:22px; }
  .shSub { display:flex; align-items:center; margin-bottom:26px; }
  .shIcon { width:150px; height:150px; border-radius:36px; flex:none; margin-right:28px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#8e8e93,#48484a); }
  .shIcon svg { width:96px; height:96px; } .shIcon img { width:100%; height:100%; object-fit:cover; }
  .shCap { font-size:22px; color:var(--dim); line-height:1.45; }
  .grp { font-size:21px; color:var(--faint); font-weight:600; margin:26px 26px 10px; text-transform:uppercase; letter-spacing:1.5px; }
  .grp:first-child { margin-top:0; }
  .rw { display:flex; align-items:center; justify-content:space-between; min-height:78px; padding:0 28px; border-radius:22px; margin-bottom:8px;
    font-size:27px; font-weight:500; background:rgba(255,255,255,.075); transition:background .12s, color .12s, transform .18s var(--ease), box-shadow .18s; }
  .rw .l { display:flex; align-items:center; min-width:0; }
  .rw .l span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rw .v { color:var(--dim); display:flex; align-items:center; white-space:nowrap; margin-left:24px; }
  .rw .chev { margin-left:16px; opacity:.55; font-size:40px; line-height:1; }
  .rw .ck { color:#0a84ff; font-size:34px; font-weight:700; }
  .rw .th { width:96px; height:58px; border-radius:12px; margin-right:24px; flex:none; background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:30px; font-weight:700; color:#fff; }
  .rw .th img { max-width:70%; max-height:70%; }
  .rw .th img.full { max-width:100%; max-height:100%; height:100%; }
  .rw .ext { margin-left:16px; opacity:.55; font-size:28px; }
  .rw.focus .adj:before { content:'‹  '; } .rw.focus .adj:after { content:'  ›'; }
  .rw.info { background:transparent; }
  .rw.focus { background:#fff; color:#000; transform:scale(1.035); box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .rw.focus .v { color:rgba(0,0,0,.55); }
  .rw.red { color:#ff453a; }

  @keyframes kb1 { from { transform:scale(1.02) translate(0,0); } to { transform:scale(1.14) translate(-50px,-20px); } }

// Códigos de cielo de AEMET -> códigos WMO equivalentes, para reutilizar los mismos iconos
function aemetToWmo(c){
  c = parseInt(c, 10);
  if(c === 11) return 0;
  if(c === 12 || c === 13 || c === 17) return 2;
  if(c >= 14 && c <= 16) return 3;
  if(c >= 81 && c <= 83) return 45;
  if((c >= 33 && c <= 36) || (c >= 71 && c <= 74)) return 71;
  if((c >= 51 && c <= 54) || (c >= 61 && c <= 64)) return 95;
  if((c >= 23 && c <= 26) || (c >= 43 && c <= 46)) return 61;
  return 3;
}
function getXML(url, ok, ko){

  x.onload = function(){ if(x.status === 200 && x.responseXML) ok(x.responseXML); else if(ko) ko(new Error('AEMET '+x.status)); };
  x.onerror = x.ontimeout = function(){ if(ko) ko(new Error('sin conexión')); };
  x.send();
}
function fetchAemet(name, ine, ok, ko){
  getXML('https://www.aemet.es/xml/municipios_h/localidad_h_'+ine+'.xml', function(xh){
    var n = new Date(), today = n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()), rows = [];
    [].forEach.call(xh.querySelectorAll('dia'), function(d){
      var temps = {};
      [].forEach.call(d.querySelectorAll('temperatura'), function(t){ temps[t.getAttribute('periodo')] = parseFloat(t.textContent); });
      [].forEach.call(d.querySelectorAll('estado_cielo'), function(e){
        var per = e.getAttribute('periodo'), v = e.textContent;
        if(temps[per] === undefined || !v) return;
        rows.push({ k:d.getAttribute('fecha')+' '+per, h:per, t:temps[per], code:aemetToWmo(v), day: v.indexOf('n') < 0 ? 1 : 0, desc:e.getAttribute('descripcion') });
      });
    });
    var nowK = today+' '+pad(n.getHours()), cur = null, next = [];
    rows.forEach(function(r){ if(r.k <= nowK) cur = r; else if(next.length < 6 && (!next.length || next[next.length-1].k !== r.k)) next.push(r); });
    cur = cur || rows[0];
    if(!cur) return ko(new Error('AEMET sin datos'));
    getXML('https://www.aemet.es/xml/municipios/localidad_'+ine+'.xml', function(xd){
      var d0 = xd.querySelector('dia'), mx = d0 && d0.querySelector('temperatura maxima'), mn = d0 && d0.querySelector('temperatura minima');
      ok({ at:Date.now(), loc:{ name:name, fixed:true, src:'AEMET' }, cur:{ temperature_2m:cur.t, weather_code:cur.code, is_day:cur.day, desc:cur.desc },
        max: mx ? parseFloat(mx.textContent) : cur.t, min: mn ? parseFloat(mn.textContent) : cur.t,
        hours: next.map(function(r){ return [r.h, r.t, r.code, r.day]; }) });
    }, ko);
  }, ko);
}

function openMenu(){
  var it = ITEMS[L[f]], opts = [];
  opts.push({ g:'open', label: it.settings ? 'Abrir Ajustes' : 'Abrir', ok:function(){ activate(it); } });
  opts.push({ g:'move', label:'Editar pantalla de inicio', ok:startMove });
  if(row(f) > 0) opts.push({ g:'top', label:'Mover a la fila superior', ok:function(){ moveTo(L[f], f % COLS); toast(it.name+' está en la fila superior'); } });
  if(it.source && it.source.type === 'HDMI') opts.push({ g:'hdmi', label:'Puerto: HDMI '+it.source.number, ok:function(){ openSettings(portPage(it)); } });
  if(!it.settings){ opts.push(null); opts.push({ g:'hide', label:'Ocultar', red:true, ok:function(){ S.hidden.push(it.key); persist(); build(); toast(it.name+' oculta · recupérala en Ajustes'); } }); }
  MENU = opts.filter(function(o){ return o; }); mi = 0;
  var h = '';
  opts.forEach(function(o){ h += o ? '<div class="mi'+(o.red?' red':'')+'">'+G(o.g, 34)+esc(o.label)+'</div>' : '<div class="msep"></div>'; });
  var m = $('menu'); m.innerHTML = h;

  var p = pos(f), y = p.y + pageY(f), x = Math.max(60, Math.min(1920 - 580, p.x + TW/2 - 260));

  if(y + TH + 50 + hgt < 1060){ m.style.top = (y + TH + 40)+'px'; m.classList.remove('up'); }
  else { m.style.top = (y - hgt - 28)+'px'; m.classList.add('up'); }
  m.style.left = x+'px'; panelShow(m); paintMenu();
}
function paintMenu(){ var els = $('menu').querySelectorAll('.mi'); for(var i=0;i<els.length;i++) els[i].classList.toggle('focus', i===mi); }
function closeMenu(){ MENU = null; panelHide($('menu'), 300); }
function menuKey(k){
  if(k===38){ mi = Math.max(0, mi-1); paintMenu(); }
  else if(k===40){ mi = Math.min(MENU.length-1, mi+1); paintMenu(); }
  else if(k===13){ var o = MENU[mi]; closeMenu(); o.ok(); }
  else if(k===10009 || k===405) closeMenu();
}

function hint(html){ var h = $('hint'); if(html){ h.innerHTML = html; h.classList.add('on'); } else h.classList.remove('on'); }
function startMove(){
  moving = true; $('grid').classList.add('editing'); TILES[L[f]].classList.add('moving');
  hint('Usa las flechas para mover la app <span class="kb">OK</span> terminar');

function endMove(){
  moving = false; $('grid').classList.remove('editing');
  Object.keys(TILES).forEach(function(k){ TILES[k].classList.remove('moving'); });

function moveTo(key, j){
  var keys = L.slice(), a = keys.indexOf(key);
  keys.splice(a, 1); keys.splice(j, 0, key);
  // Las ocultas conservan su sitio al final del orden guardado
  S.order = keys.concat(S.order.filter(function(k){ return keys.indexOf(k) < 0; }));
  persist(); L[f] = key; build();
  f = L.indexOf(key); focus(f);
}
function moveKey(k){
  if(k===13 || k===10009){ endMove(); return; }
  var d = { 37:-1, 39:1, 38:-COLS, 40:COLS }[k]; if(!d) return;
  if((k===37 && f % COLS === 0) || (k===39 && f % COLS === COLS-1)) return;
  var j = f + d;
  if(j < 0 || j >= L.length) return;
  moveTo(L[f], j);
}

  var a = wAct(wSel);
  if(a){ clearTimeout(shelfT); $('shelfTitle').textContent = a.t; $('shelfSub').textContent = a.s; }
  bumpIdle();
}
function wBlur(){ onW = false; wEls().forEach(function(e){ e.classList.remove('focus'); }); }
// Siguiente elemento en una dirección según su posición en pantalla (navegación espacial sencilla)
function wNear(dx, dy){
  var els = wEls(), r0 = els[wSel].getBoundingClientRect(), cx = r0.left + r0.width/2, cy = r0.top + r0.height/2, best = -1, bd = 1e9;
  els.forEach(function(e, j){
    if(j === wSel) return;
    var r = e.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
    var along = dx ? (x - cx) * dx : (y - cy) * dy, across = dx ? Math.abs(y - cy) : Math.abs(x - cx);
    if(along <= 10) return;
    var d = along + across * 2; if(d < bd){ bd = d; best = j; }
  });
  return best;
}
function wTurn(d){
  var n = wPage + d; if(n < 0 || n >= WPAGES.length) return;
  wPage = n; save('wPage', wPage); wRender();
  // Se entra por la primera ficha normal: si fuera el volumen, la siguiente ◀▶ lo cambiaría sin querer
  var els = wEls(), i = d > 0 ? 0 : els.length - 1;
  while(wAct(i) && wAct(i).lr && i + d >= 0 && i + d < els.length) i += d > 0 ? 1 : -1;
  wFocus(i);
}
function wKey(k){
  var a = wAct(wSel), j;
  if(k===13){ if(a && a.ok){ var cur = wSel; a.ok(); if(onW && wPage === 1){ wPaintCtl(); wFocus(cur); } } return; }
  if(k===10009){ focus(f); return; }
  if(k===403 || k===406){ openSettings(); return; }
  if((k===37 || k===39) && a && a.lr){ a.lr(k===39 ? 2 : -2); wPaintCtl(); wFocus(wSel); return; }
  if(k===37 || k===39){ j = wNear(k===39 ? 1 : -1, 0); if(j >= 0) wFocus(j); else wTurn(k===39 ? 1 : -1); return; }
  if(k===38){ j = wNear(0, -1); if(j >= 0) wFocus(j); else { wBlur(); focusPill(); } return; }
  if(k===40){ j = wNear(0, 1); if(j >= 0) wFocus(j); else focus(f); }
}

// ---------- Reloj ----------
function tick(){
  var n = new Date(), t = pad(n.getHours())+':'+pad(n.getMinutes());
  var d = n.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'}); d = d.charAt(0).toUpperCase() + d.slice(1);
  $('pillT').textContent = t; $('sT').textContent = t; var st = $('shTime'); if(st) st.textContent = t;
}
